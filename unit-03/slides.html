<!doctype html>
<title>Python Unit 3</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one lesson card per screen. Explanation left, runnable code right. */
:root {
  --bg: #eaf0f6; --surface: #f8fafc; --ink: #12263f; --muted: #53677d; --line: #c9d6e3;
  --accent: #27609f; --sun: #ffd43b; --sun-ink: #2a2100;
  --code-bg: #12263f; --code-ink: #e6eef7;
  --good: #14765a; --bad: #b83232; --good-bg: #dcf1e9; --bad-bg: #f9e2e2;
  --display: "Bricolage Grotesque", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1724; --surface: #15212f; --ink: #e4edf6; --muted: #98abbf; --line: #2c3c4f;
  --accent: #82b6ee; --code-bg: #07101b; --code-ink: #e6eef7;
  --good: #58cda2; --bad: #f28b8b; --good-bg: #123229; --bad-bg: #3a1c1f; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1724; --surface: #15212f; --ink: #e4edf6; --muted: #98abbf; --line: #2c3c4f;
  --accent: #82b6ee; --code-bg: #07101b; --code-ink: #e6eef7;
  --good: #58cda2; --bad: #f28b8b; --good-bg: #123229; --bad-bg: #3a1c1f; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body);
  display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header, main, footer { width: 100%; max-width: 1080px; margin-inline: auto; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.unit { font: 800 18px/1.2 var(--display); flex: 1 1 200px; min-width: 0; }
.unit small { display: block; font: 400 13px/1.3 var(--body); color: var(--muted); }
.home { font-size: 14px; color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 4px 12px; font-weight: 700; font-size: 14px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.steps { display: flex; gap: 4px; width: 100%; }
.steps button { flex: 1; height: 12px; min-width: 0; padding: 0; border: 0; border-radius: 2px; background: var(--line); }
.steps button.seen { background: var(--accent); }
.steps button.good { background: var(--good); }
.steps button.bad { background: var(--bad); }
.steps button.now { outline: 2px solid var(--sun); outline-offset: 1px; }
main { flex: 1; min-height: 0; overflow-y: auto; }
.slide { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 28px; padding-block: 12px; }
.slide.solo { grid-template-columns: minmax(0, 1fr); max-width: 680px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tag { align-self: flex-start; font: 600 12px/1 var(--mono); letter-spacing: .08em; padding: 5px 8px; background: var(--sun); color: var(--sun-ink); }
h1 { font: 800 clamp(28px, 4.2vw, 42px)/1.08 var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 65ch; }
.explain { border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); }
.added { font: 600 12px var(--mono); background: var(--sun); color: var(--sun-ink); padding: 1px 5px; }
.label { font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
pre { margin: 0; padding: 12px 14px; background: var(--code-bg); color: var(--code-ink); font: 400 15px/1.5 var(--mono); font-variant-ligatures: none; overflow-x: auto; white-space: pre; }
pre.out { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.typed { font-size: 14px; color: var(--muted); }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.pair > div { min-width: 0; }
.verdict { font: 600 13px var(--mono); padding: 6px 14px; word-break: break-word; }
.wrong .verdict { background: var(--bad-bg); color: var(--bad); }
.right .verdict { background: var(--good-bg); color: var(--good); }
.check { background: var(--surface); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.check .q { font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { background: var(--surface); border: 1px solid var(--ink); padding: 7px 14px; font-weight: 700; font-size: 15px; align-self: flex-start; text-decoration: none; }
.btn.main { background: var(--ink); color: var(--bg); }
.btn.on-good { background: var(--good); border-color: var(--good); color: var(--bg); }
.btn.on-bad { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.btn:disabled { opacity: .4; cursor: default; }
.src { font-size: 13px; color: var(--muted); }
.src a { color: var(--accent); }
footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count { font: 400 14px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.score { font: 800 64px/1 var(--display); }
@media (max-width: 760px) { .slide { grid-template-columns: minmax(0, 1fr); gap: 18px; } body { font-size: 16px; } }
</style>

<header>
  <a class="home" id="home" href="../" hidden></a>
  <div class="unit" id="unit"></div>
  <div class="lang" role="group" aria-label="Language">
    <button id="lang-en" type="button">EN</button>
    <button id="lang-id" type="button">ID</button>
  </div>
  <nav class="steps" id="steps" aria-label="Slides"></nav>
</header>
<main id="main" tabindex="-1"></main>
<footer>
  <button class="btn" id="prev" type="button"></button>
  <span class="count" id="count"></span>
  <button class="btn main" id="next" type="button"></button>
</footer>

in": "Di loop bersarang, break hanya keluar dari loop paling dalam.", "quick_check": {"q": "Apa yang tercetak dari for n in range(5): if n == 2: continue lalu print(n)?", "a": "0, 1, 3 dan 4."}}}, {"chapter": "Unit 3. Loops", "title": "Ask again until the input is valid", "tag": "HOW", "body": "while True starts a loop with no end of its own. Ask for input inside it, and break once the input is good. Bad input just asks again.", "input": ["-2", "0", "5"], "code": "while True:\n    n = int(input())\n    if n > 0:\n        break\nprint(n)", "output": "5", "explain": "Here the user types -2, 0, then 5. Only 5 passes the check.", "quick_check": {"q": "What ends a while True loop?", "a": "break, once the input is valid."}, "sources": [{"label": "CS50P Week 2 notes", "url": "https://cs50.harvard.edu/python/notes/2/"}, {"label": "GeeksforGeeks: loops", "url": "https://www.geeksforgeeks.org/python/loops-in-python/"}], "id": {"chapter": "Unit 3. Perulangan", "title": "Tanya lagi sampai input valid", "body": "while True memulai loop tanpa akhir. Minta input di dalamnya, lalu break saat inputnya benar. Input yang salah cukup ditanyakan lagi.", "explain": "Di sini pengguna mengetik -2, 0, lalu 5. Hanya 5 yang lolos pengecekan.", "quick_check": {"q": "Apa yang menghentikan while True?", "a": "break, saat input sudah valid."}}}, {"chapter": "Unit 3. Loops", "title": "A loop's else runs when nothing broke", "tag": "REMEMBER", "body": "A for or while loop can have an else. It runs when the loop finishes normally, and it's skipped when break ends the loop. It's useful for searches.", "code": "for n in [3, 5, 7]:\n    if n % 2 == 0:\n        print(\"found an even number\")\n        break\nelse:\n    print(\"no even number\")", "output": "no even number", "explain": "This else belongs to the for, not the if. It lines up with the for.", "quick_check": {"q": "If a loop ends with break, does its else run?", "a": "No."}, "sources": [{"label": "Python tutorial: control flow", "url": "https://docs.python.org/3.13/tutorial/controlflow.html"}, {"label": "W3Schools: while loops", "url": "https://www.w3schools.com/python/python_while_loops.asp"}, {"label": "W3Schools: for loops", "url": "https://www.w3schools.com/python/python_for_loops.asp"}], "id": {"chapter": "Unit 3. Perulangan", "title": "else pada loop berjalan saat tidak ada break", "body": "for atau while bisa punya else. else berjalan saat loop selesai normal, dan dilewati saat break mengakhiri loop. Ini berguna untuk pencarian.", "explain": "else ini milik for, bukan if. Indentasinya sejajar dengan for.", "quick_check": {"q": "Jika loop berakhir karena break, apakah else berjalan?", "a": "Tidak."}}}, {"chapter": "Unit 3. Loops", "title": "enumerate gives the position too", "tag": "HOW", "body": "enumerate gives each item together with its position. Use start=1 to count from 1 for people to read. It's cleaner than range(len(items)).", "code": "for i, name in enumerate([\"Ayu\", \"Budi\"], start=1):\n    print(i, name)", "output": "1 Ayu\n2 Budi", "explain": "Without start, counting begins at 0.", "quick_check": {"q": "What does enumerate([\"a\"]) give first?", "a": "(0, 'a')"}, "sources": [{"label": "Python docs: built-in functions", "url": "https://docs.python.org/3.13/library/functions.html"}, {"label": "CS50P Week 2 notes", "url": "https://cs50.harvard.edu/python/notes/2/"}], "id": {"chapter": "Unit 3. Perulangan", "title": "enumerate juga memberi posisinya", "body": "enumerate memberi setiap item bersama posisinya. Pakai start=1 untuk menghitung dari 1 agar mudah dibaca orang. Ini lebih rapi dari range(len(items)).", "explain": "Tanpa start, hitungan mulai dari 0.", "quick_check": {"q": "Apa yang pertama diberikan enumerate([\"a\"])?", "a": "(0, 'a')"}}}, {"chapter": "Unit 3. Loops", "title": "zip walks two lists together", "tag": "HOW", "body": "zip pairs the first item of each list, then the second, and so on. It stops when the shortest list runs out, so extra items are dropped without an error.", "code": "for name, score in zip([\"Ayu\", \"Budi\"], [90, 85]):\n    print(name, score)\nprint(list(zip([1, 2, 3], [\"a\", \"b\"])))", "output": "Ayu 90\nBudi 85\n[(1, 'a'), (2, 'b')]", "explain": "zip(..., strict=True) raises an error if the lengths differ.", "quick_check": {"q": "How many pairs does zip([1, 2, 3], [\"a\"]) give?", "a": "One: (1, 'a')."}, "sources": [{"label": "Python docs: built-in functions", "url": "https://docs.python.org/3.13/library/functions.html"}], "id": {"chapter": "Unit 3. Perulangan", "title": "zip menelusuri dua list bersamaan", "body": "zip memasangkan item pertama dari setiap list, lalu item kedua, dan seterusnya. zip berhenti saat list terpendek habis, jadi item sisa dibuang tanpa error.", "explain": "zip(..., strict=True) akan error jika panjang list berbeda.", "quick_check": {"q": "Berapa pasangan yang diberikan zip([1, 2, 3], [\"a\"])?", "a": "Satu: (1, 'a')."}}}, {"chapter": "Unit 3. Loops", "title": "Loops inside loops", "tag": "HOW", "body": "A loop can sit inside another loop. The inner loop runs completely for every pass of the outer loop, which is how you build rows and columns.", "code": "for row in range(2):\n    for col in range(3):\n        print(\"#\", end=\"\")\n    print()", "output": "###\n###", "explain": "end=\"\" keeps print on the same line, and an empty print() moves to a new line.", "quick_check": {"q": "Outer range(2), inner range(3). How many times does the inner body run?", "a": "6 times."}, "sources": [{"label": "CS50P Week 2 notes", "url": "https://cs50.harvard.edu/python/notes/2/"}, {"label": "W3Schools: for loops", "url": "https://www.w3schools.com/python/python_for_loops.asp"}, {"label": "GeeksforGeeks: loops", "url": "https://www.geeksforgeeks.org/python/loops-in-python/"}], "id": {"chapter": "Unit 3. Perulangan", "title": "Loop di dalam loop", "body": "Sebuah loop bisa berada di dalam loop lain. Loop dalam berjalan penuh untuk setiap putaran loop luar, dan begitulah cara membuat baris dan kolom.", "explain": "end=\"\" membuat print tetap di baris yang sama, dan print() kosong pindah ke baris baru.", "quick_check": {"q": "Luar range(2), dalam range(3). Berapa kali loop dalam berjalan?", "a": "6 kali."}}}, {"chapter": "Unit 3. Loops", "title": "Worked example: times table", "tag": "HOW", "body": "Read a number n and print its times table from 1 to 5, one line each, like 3 x 2 = 6.", "input": ["3"], "code": "n = int(input())\nfor i in range(1, 6):\n    print(f\"{n} x {i} = {n * i}\")", "output": "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15", "explain": "[ADDED] My own example, built from this unit's ideas. The range ends at 6 so that 5 is included. An f-string builds each line.", "quick_check": {"q": "Change it to go up to 10. What changes?", "a": "range(1, 6) becomes range(1, 11)."}, "sources": [{"label": "CS50P Week 2 notes", "url": "https://cs50.harvard.edu/python/notes/2/"}, {"label": "W3Schools: for loops", "url": "https://www.w3schools.com/python/python_for_loops.asp"}], "id": {"chapter": "Unit 3. Perulangan", "title": "Contoh soal: tabel perkalian", "body": "Baca angka n lalu cetak tabel perkaliannya dari 1 sampai 5, satu baris per hasil, seperti 3 x 2 = 6.", "explain": "[ADDED] Contoh buatan sendiri dari materi unit ini. Angka akhir range-nya 6 supaya 5 ikut. f-string menyusun setiap baris.", "quick_check": {"q": "Ubah supaya tabelnya sampai 10. Apa yang berubah?", "a": "range(1, 6) jadi range(1, 11)."}}}, {"chapter": "Unit 3. Loops", "title": "Worked example: average until 0", "tag": "HOW", "body": "Read numbers until the user types 0, then print their average with 1 decimal place. You don't know how many numbers will come, so use while True.", "input": ["4", "8", "6", "0"], "code": "total = 0\ncount = 0\nwhile True:\n    n = int(input())\n    if n == 0:\n        break\n    total += n\n    count += 1\nif count == 0:\n    print(\"No numbers\")\nelse:\n    print(f\"{total / count:.1f}\")", "output": "6.0", "explain": "[ADDED] My own example, built from this unit's ideas. Keep a total and a count, break on 0, then check count so you never divide by zero.", "quick_check": {"q": "What happens without the count == 0 check if the first input is 0?", "a": "ZeroDivisionError, because total / count is 0 / 0."}, "sources": [{"label": "CS50P Week 2 notes", "url": "https://cs50.harvard.edu/python/notes/2/"}, {"label": "W3Schools: while loops", "url": "https://www.w3schools.com/python/python_while_loops.asp"}], "id": {"chapter": "Unit 3. Perulangan", "title": "Contoh soal: rata-rata sampai 0", "body": "Baca angka sampai pengguna mengetik 0, lalu cetak rata-ratanya dengan 1 angka desimal. Jumlah angkanya tidak diketahui, jadi pakai while True.", "explain": "[ADDED] Contoh buatan sendiri dari materi unit ini. Simpan total dan count, break saat 0, lalu cek count supaya tidak membagi dengan nol.", "quick_check": {"q": "Apa yang terjadi tanpa pengecekan count == 0 jika input pertama 0?", "a": "ZeroDivisionError, karena total / count menjadi 0 / 0."}}}]</script>
<script>
const SLIDES = JSON.parse(document.getElementById("data").textContent);
const UNIT = 3;
const KEY = "python-unit-" + UNIT;
const UI = {
  en: { prev: "Back", next: "Next", finish: "Finish", show: "Show answer", got: "I got it", miss: "Review this",
        code: "Code", output: "Output", typed: "Typed:", wrong: "Wrong", right: "Right", check: "Quick check",
        result: "Result:", sources: "Sources:", done: "Unit finished", correct: "quick checks correct",
        review: "Review these slides:", none: "Nothing to review. Nice work.",
        nextStep: "Next, solve this unit's problems.", again: "Start over", home: "All units", problems: "Open the problems" },
  id: { prev: "Kembali", next: "Lanjut", finish: "Selesai", show: "Lihat jawaban", got: "Aku paham", miss: "Ulangi ini",
        code: "Kode", output: "Hasil", typed: "Diketik:", wrong: "Salah", right: "Benar", check: "Cek cepat",
        result: "Hasil:", sources: "Sumber:", done: "Unit selesai", correct: "cek cepat benar",
        review: "Ulangi slide ini:", none: "Tidak ada yang perlu diulang. Mantap.",
        nextStep: "Sekarang kerjakan soal unit ini.", again: "Mulai lagi", home: "Semua unit", problems: "Buka soal" }
};

let state = { at: 0, lang: "en", marks: {} };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const shown = {};
if (!(state.at >= 0 && state.at <= SLIDES.length)) state.at = 0;

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function ui(name) { return UI[state.lang][name]; }
function text(slide, field) {
  return state.lang === "id" ? slide.id[field] : slide[field];
}
function el(tag, cls, content) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (content !== undefined) node.textContent = content;
  return node;
}
function para(value, cls) {
  const node = el("p", cls);
  const parts = value.split("[ADDED]");
  parts.forEach((part, index) => {
    if (index) node.append(el("span", "added", "ADDED"));
    node.append(part);
  });
  return node;
}
function block(label, code, cls) {
  const box = el("div");
  box.append(el("div", "label", label), el("pre", cls, code));
  return box;
}
function pairSide(kind, code, result) {
  const box = el("div", kind);
  const pre = el("pre", "", code);
  pre.tabIndex = 0;
  box.append(el("div", "label", ui(kind)), pre, el("div", "verdict", ui("result") + " " + result));
  return box;
}

function quickCheck(slide, index) {
  const box = el("div", "check");
  const qc = text(slide, "quick_check");
  box.append(el("div", "label", ui("check")), el("div", "q", qc.q));
  if (!shown[index] && !state.marks[index]) {
    const show = el("button", "btn", ui("show"));
    show.type = "button";
    show.onclick = () => { shown[index] = true; render(); };
    box.append(show);
    return box;
  }
  box.append(el("p", "", qc.a));
  const row = el("div", "row");
  [["got", "good", "on-good"], ["miss", "bad", "on-bad"]].forEach(([word, mark, cls]) => {
    const pick = el("button", "btn" + (state.marks[index] === mark ? " " + cls : ""), ui(word));
    pick.type = "button";
    pick.setAttribute("aria-pressed", String(state.marks[index] === mark));
    pick.onclick = () => { state.marks[index] = mark; save(); render(); };
    row.append(pick);
  });
  box.append(row);
  return box;
}

function slideView(slide, index) {
  const hasCode = slide.code || slide.wrong_right;
  const page = el("article", "slide" + (hasCode ? "" : " solo"));
  const left = el("div", "col");
  left.append(el("span", "tag", slide.tag), el("h1", "", text(slide, "title")), para(text(slide, "body")));
  if (slide.explain) left.append(para(text(slide, "explain"), "explain"));
  left.append(quickCheck(slide, index));
  const src = el("p", "src", ui("sources") + " ");
  slide.sources.forEach((source, at) => {
    const link = el("a", "", source.label);
    link.href = source.url;
    link.target = "_blank";
    link.rel = "noopener";
    if (at) src.append(", ");
    src.append(link);
  });
  left.append(src);
  page.append(left);
  if (!hasCode) return page;

  const right = el("div", "col");
  if (slide.code) {
    right.append(block(ui("code"), slide.code), block(ui("output"), slide.output, "out"));
  }
  if (slide.input) right.append(el("div", "typed", ui("typed") + " " + slide.input.join(", ")));
  const pair = slide.wrong_right;
  if (pair) {
    const both = el("div", "pair");
    both.append(pairSide("wrong", pair.wrong, pair.wrong_result), pairSide("right", pair.right, pair.right_result));
    right.append(both, el("p", "", state.lang === "id" ? slide.id.wrong_right_reason : pair.reason));
  }
  page.append(right);
  return page;
}

function endView() {
  const page = el("article", "slide solo");
  const col = el("div", "col");
  const good = SLIDES.filter((_, index) => state.marks[index] === "good").length;
  col.append(el("h1", "", ui("done")), el("div", "score", good + " / " + SLIDES.length), el("p", "", ui("correct")));
  const missed = SLIDES.map((slide, index) => [slide, index]).filter(([, index]) => state.marks[index] !== "good");
  if (!missed.length) col.append(el("p", "", ui("none")));
  else {
    col.append(el("p", "", ui("review")));
    const row = el("div", "row");
    missed.forEach(([slide, index]) => {
      const jump = el("button", "btn", (index + 1) + ". " + text(slide, "title"));
      jump.type = "button";
      jump.onclick = () => go(index);
      row.append(jump);
    });
    col.append(row);
  }
  col.append(el("p", "", ui("nextStep")));
  const problems = el("a", "btn main", ui("problems"));
  problems.href = "problems.html";
  col.append(problems);
  const again = el("button", "btn", ui("again"));
  again.type = "button";
  again.onclick = () => {
    state.marks = {};
    Object.keys(shown).forEach((key) => delete shown[key]);
    go(0);
  };
  col.append(again);
  page.append(col);
  return page;
}

function render() {
  const at = state.at;
  document.documentElement.lang = state.lang;
  const home = document.getElementById("home");
  home.textContent = ui("home");
  home.hidden = !location.protocol.startsWith("http");
  const unit = document.getElementById("unit");
  unit.textContent = "Python";
  unit.append(el("small", "", text(SLIDES[0], "chapter")));
  ["en", "id"].forEach((code) => {
    const btn = document.getElementById("lang-" + code);
    btn.setAttribute("aria-pressed", String(state.lang === code));
    btn.onclick = () => { state.lang = code; save(); render(); };
  });
  const steps = document.getElementById("steps");
  steps.replaceChildren();
  SLIDES.forEach((slide, index) => {
    const step = el("button");
    step.type = "button";
    step.setAttribute("aria-label", (index + 1) + ". " + text(slide, "title"));
    step.title = text(slide, "title");
    const mark = state.marks[index];
    step.className = (mark || (index < at ? "seen" : "")) + (index === at ? " now" : "");
    step.onclick = () => go(index);
    steps.append(step);
  });
  const main = document.getElementById("main");
  main.replaceChildren(at < SLIDES.length ? slideView(SLIDES[at], at) : endView());
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  prev.textContent = ui("prev");
  prev.disabled = at === 0;
  next.textContent = at === SLIDES.length - 1 ? ui("finish") : ui("next");
  next.hidden = at === SLIDES.length;
  document.getElementById("count").textContent = at < SLIDES.length ? (at + 1) + " / " + SLIDES.length : "";
}

function go(index) {
  state.at = Math.max(0, Math.min(SLIDES.length, index));
  save();
  render();
  document.getElementById("main").scrollTop = 0;
}
document.getElementById("prev").onclick = () => go(state.at - 1);
document.getElementById("next").onclick = () => go(state.at + 1);
document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") go(state.at + 1);
  if (event.key === "ArrowLeft") go(state.at - 1);
});
render();
</script>
